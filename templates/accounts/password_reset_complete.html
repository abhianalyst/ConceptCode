{% extends "base.html" %}

{% block title %}Password Changed | ConceptCode{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <div class="card cc-card shadow-sm text-center">
                    <div class="card-body p-4">

                        <h1 class="h3 mb-3">
                            Password changed successfully
                        </h1>

                        <p class="text-muted mb-4">
                            Your password has been updated.
                        </p>

                        <a
                            href="{% url 'accounts:login' %}"
                            class="btn cc-primary"
                        >
                            Log in
                        </a>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}

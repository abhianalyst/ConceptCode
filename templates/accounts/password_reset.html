<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ConceptCode</title>
</head>

<body>
    <main>
        <h1>Reset your password</h1>

        <p>
            Enter your email address and we'll send you a password reset link.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div>
                {{ form.email.label_tag }}
                {{ form.email }}
                {{ form.email.errors }}
            </div>

            <button type="submit">
                Send reset link
            </button>
        </form>

        <p>
            <a href="{% url 'accounts:login' %}">
                Back to login
            </a>
        </p>
    </main>
</body>

</html>

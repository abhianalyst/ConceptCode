{% extends "base.html" %}

{% block title %}Email Verification | ConceptCode{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card cc-card shadow-sm">
                    <div class="card-body p-4 p-md-5 text-center">

                        <h1 class="h3 mb-3">
                            Email verification failed
                        </h1>

                        <div
                            class="alert alert-danger"
                            role="alert"
                        >
                            {{ message }}
                        </div>

                        <a
                            href="{% url 'accounts:register' %}"
                            class="btn cc-primary"
                        >
                            Create an account
                        </a>

                    </div>
                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
